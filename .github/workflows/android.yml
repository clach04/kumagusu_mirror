name: Android CI

on:
  push:
    branches: [ "main", "issues_21_refactor_filetypes" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
      environment:
        description: 'Deployment environment'
        required: false
        default: 'staging'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    #- name: regen Gradle
    #  run: gradle wrapper
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
